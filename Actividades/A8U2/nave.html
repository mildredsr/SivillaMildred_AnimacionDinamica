<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Floating Leaf</title>
  <link rel="stylesheet" href="style6.css">
</head>

<body>
  <main>
    <h1>FLOATING LEAF</h1>

    <div class="pool-frame">
      <div class="pool-water">

        <img
          id="water-background"
          src="fondoc.gif"
          alt=""
        >

        <canvas id="canvas" width="1000" height="500"></canvas>

      </div>
    </div>

    <section class="instructions">
      <p>Press left and right arrow keys to rotate ship, up to add thrust.</p>
    </section>

    <div class="volver">
      <a href="../../index.html" target="_blank">Regresar</a>
    </div>
  </main>

  <script src="ship.js"></script>

  <script>
    window.onload = function () {
      var canvas = document.getElementById("canvas");
      var context = canvas.getContext("2d");
      var ship = new Ship();

      ship.x = canvas.width / 2;
      ship.y = canvas.height / 2;

      var vx = 0;
      var vy = 0;
      var vr = 0;
      var thrust = 0;

      var friction = 0.985;
      var rotationSpeed = 0.045;
      var acceleration = 0.10;

      var keys = {};

      window.addEventListener("keydown", function (event) {
        if (
          event.key === "ArrowLeft" ||
          event.key === "ArrowRight" ||
          event.key === "ArrowUp"
        ) {
          event.preventDefault();
        }

        keys[event.key] = true;
      });

      window.addEventListener("keyup", function (event) {
        keys[event.key] = false;
      });

      window.addEventListener("blur", function () {
        keys = {};
      });

      function drawFrame() {
        requestAnimationFrame(drawFrame);

        context.clearRect(0, 0, canvas.width, canvas.height);

        vr = 0;
        thrust = 0;

        if (keys["ArrowLeft"]) {
          vr = -rotationSpeed;
        }

        if (keys["ArrowRight"]) {
          vr = rotationSpeed;
        }

        if (keys["ArrowUp"]) {
          thrust = acceleration;
        }

        ship.rotation += vr;

        var angle = ship.rotation;
        var ax = Math.cos(angle) * thrust;
        var ay = Math.sin(angle) * thrust;

        vx += ax;
        vy += ay;

        vx *= friction;
        vy *= friction;

        ship.x += vx;
        ship.y += vy;

        var margin = Math.max(ship.width, ship.height) / 2;

        var left = margin;
        var right = canvas.width - margin;
        var top = margin;
        var bottom = canvas.height - margin;

        if (ship.x < left) {
          ship.x = left;
          if (vx < 0) {
            vx *= -1;
          }
        } else if (ship.x > right) {
          ship.x = right;
          if (vx > 0) {
            vx *= -1;
          }
        }

        if (ship.y < top) {
          ship.y = top;
          if (vy < 0) {
            vy *= -1;
          }
        } else if (ship.y > bottom) {
          ship.y = bottom;
          if (vy > 0) {
            vy *= -1;
          }
        }

        // Ondas de agua
        var speed = Math.sqrt(vx * vx + vy * vy);

        if (speed > 0.5) {
          ship.rippleTimer++;

          if (ship.rippleTimer >= 14) {
            ship.createRipple();
            ship.rippleTimer = 0;
          }
        } else {
          ship.rippleTimer = 0;
        }

        ship.drawRipples(context);
        ship.draw(context);
      }
      drawFrame();
    };
  </script>
</body>
</html>
